services:
  db:
    image: postgres:16-alpine
    container_name: tennis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tennis
      POSTGRES_PASSWORD: tennis
      POSTGRES_DB: tennis
    ports:
      - "5432:5432"
    volumes:
      - tennis-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tennis -d tennis"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tennis-db-data:
